; RoboReach PlatformIO Configuration
; ESP32 Dev Module with Arduino-ESP32 core 3.x (pioarduino platform)

[env:esp32dev]
platform = pioarduino
board = esp32dev
framework = arduino
monitor_speed = 115200

; Upload port - set to COM14 as specified
; Change this to match your actual COM port
upload_port = COM14

; Monitor port - set to COM14 as specified
monitor_port = COM14

; Build properties
build_flags = 
    ; Enable C++ exceptions if needed
    ; -DARDUINO_ARCH_ESP32

; Library dependencies
lib_deps = 
    madhephaestus/ESP32Servo
    ; RoboLink library - installed via Arduino Library Manager

; Debugging options
debug_tool = cmsis-dap

; Upload options
upload_speed = 921600